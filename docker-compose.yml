version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusfix-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./campusfix.db
      - SECRET_KEY=campusfix-production-secret-key-2024
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/campusfix.db:/app/campusfix.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusfix-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
